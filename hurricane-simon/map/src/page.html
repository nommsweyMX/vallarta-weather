<title>Simon and Vallarta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Mono:wght@400;500;700&family=Red+Hat+Text:wght@400;500;700&display=swap">
<style>
/* Layout: observed satellite loop beside a street-level map of Vallarta, one shared timeline, then a threat timeline per building. */
:root{
  --bg:#f1f2f4; --card:#ffffff; --ink:#151515; --ink2:#3c3f42; --muted:#5e6268; --line:#dcdfe3; --grid:#e9ebee;
  --bar:#151515; --bar-ink:#ffffff; --brand:#ee0000;
  --accent:#1769d6; --obs:#0b7a53; --ext:#151515; --nhc:#c2410c;
  --alert-fill:#c9190b; --alert-bg:#fdeceb; --alert-ink:#7d1007;
  --t0:#e9ebee; --t1:#e9c75a; --t2:#e5a823; --t3:#dd6a17; --t4:#c9190b;
  --gust:#5b45d1; --rainbar:#1769d6; --focus:#0066cc; --night:rgba(39,57,92,.08);
  --display:"Red Hat Display", "Segoe UI", system-ui, sans-serif;
  --text:"Red Hat Text", "Segoe UI", system-ui, sans-serif;
  --mono:"Red Hat Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1015; --card:#161a21; --ink:#eef1f5; --ink2:#c7cdd5; --muted:#9aa2ad; --line:#2b323c; --grid:#222831;
    --bar:#07090c; --bar-ink:#ffffff; --brand:#ff3b30;
    --accent:#4c9bff; --obs:#3ccf95; --ext:#eef1f5; --nhc:#ff8a4c;
    --alert-fill:#b3170b; --alert-bg:#341311; --alert-ink:#ffc9c3;
    --t0:#222831; --t1:#5c4c18; --t2:#8f6d12; --t3:#e27a2e; --t4:#ff8a75;
    --gust:#a99ff5; --rainbar:#4c9bff; --focus:#7fb5ff; --night:rgba(150,180,230,.07);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1015; --card:#161a21; --ink:#eef1f5; --ink2:#c7cdd5; --muted:#9aa2ad; --line:#2b323c; --grid:#222831;
  --bar:#07090c; --bar-ink:#ffffff; --brand:#ff3b30;
  --accent:#4c9bff; --obs:#3ccf95; --ext:#eef1f5; --nhc:#ff8a4c;
  --alert-fill:#b3170b; --alert-bg:#341311; --alert-ink:#ffc9c3;
  --t0:#222831; --t1:#5c4c18; --t2:#8f6d12; --t3:#e27a2e; --t4:#ff8a75;
  --gust:#a99ff5; --rainbar:#4c9bff; --focus:#7fb5ff; --night:rgba(150,180,230,.07);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

[data-lang="en"] .es{display:none}
[data-lang="es"] .en{display:none}
[data-lang="both"] .es{font-style:italic}
[data-lang="both"] .en + .es::before{content:" / ";font-style:normal}
[data-lang="both"] .bi > .es{display:block}
[data-lang="both"] .bi > .en + .es::before{content:none}
[data-lang="both"] .card .bi > .es, [data-lang="both"] .alert p .bi > .es{margin-top:6px}
[data-lang="both"] h1 .es, [data-lang="both"] h2 .es, [data-lang="both"] h3 .es{font-weight:500;font-style:normal;color:var(--muted)}
[data-lang="both"] .mono .es, [data-lang="both"] .eyebrow .es, [data-lang="both"] .chip .es, [data-lang="both"] .seg .es, [data-lang="both"] .tag .es, [data-lang="both"] .val .es, [data-lang="both"] .when .es{font-style:normal}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-bottom:3px solid var(--brand)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:9px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;letter-spacing:.01em;font-size:15px;color:var(--bar-ink);text-decoration:none}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;opacity:.75;margin-left:8px;text-transform:uppercase}
.lang{margin-left:auto;display:flex;border:1px solid #ffffff40;border-radius:8px;overflow:hidden}
.lang button{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;padding:6px 10px;color:#ffffffc8;text-align:center;line-height:1.25}
.lang button small{display:block;font-size:10px;opacity:.8}
.lang button[aria-pressed="true"]{background:#ffffff;color:#151515}
.lang button:focus-visible{outline:2px solid #7fb5ff;outline-offset:-3px}
.lang button[aria-pressed="true"]:focus-visible{outline-color:#0066cc}

.alert{background:var(--alert-bg);border-bottom:1px solid var(--line)}
.alert .wrap{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;padding-block:14px;align-items:start}
.alert .tag{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.08em;color:#fff;background:var(--alert-fill);padding:5px 9px;border-radius:5px;white-space:nowrap}
.alert p{margin:0;color:var(--alert-ink);max-width:100ch}
@media (max-width:640px){.alert .wrap{grid-template-columns:1fr}.alert .tag{justify-self:start;white-space:normal}}

.hero{padding-block:24px 8px}
.hero h1{font-size:clamp(28px,4.6vw,46px);line-height:1.06;font-weight:900;letter-spacing:-.01em}
.hero .lede{max-width:78ch;color:var(--ink2);margin:12px 0 0}
.now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:900px){.now{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{font-size:17px;font-weight:700;margin:2px 0 6px}
.card p{margin:6px 0 0;color:var(--ink2)}
.big{font-family:var(--display);font-weight:900;font-size:clamp(20px,2.4vw,26px);line-height:1.15}
.sw{display:inline-block;width:22px;height:0;border-top:3px solid var(--ext);vertical-align:middle;margin-right:6px}
.sw.nhc{border-top:3px dashed var(--nhc)}
.sw.obs{border-top:3px dotted var(--obs)}

section.block{padding-block:26px}
section.block > .wrap > h2{font-size:clamp(21px,2.6vw,28px);font-weight:900}
.sub{color:var(--muted);margin:6px 0 0;max-width:90ch}

/* player */
.ctl{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{all:unset;cursor:pointer;padding:7px 11px;font-size:13px;font-weight:500;color:var(--ink2);line-height:1.25;text-align:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.clock{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-top:14px}
.clock .when{font-family:var(--display);font-weight:900;font-size:clamp(22px,3vw,30px);line-height:1.1;min-width:9ch}
.badge{font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;color:#fff;background:var(--obs)}
.badge.fut{background:var(--ink);color:var(--bg)}
.clock .rel{font-family:var(--mono);font-size:13px;color:var(--muted)}
.scrub{position:relative;margin-top:10px}
.scrub input{width:100%;margin:0;accent-color:var(--accent);height:28px}
.scrubbar{position:relative;height:16px;margin-top:-4px;font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.scrubbar > span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.panels{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;margin-top:12px;align-items:start}
@media (max-width:900px){.panels{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.panel .ph{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;margin:2px 2px 8px}
.panel .ph h3{font-size:15px;font-weight:700}
.stage{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#0e1a27;touch-action:pan-y}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px;font-size:12px;color:var(--ink2)}
.ramp{display:inline-flex;flex-wrap:wrap;max-width:100%;align-items:center;gap:0;border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.legend > span{max-width:100%}
.ramp i{display:inline-block;font-style:normal;font-family:var(--mono);font-size:10.5px;padding:1px 5px;color:#fff;white-space:nowrap}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.chip{all:unset;cursor:pointer;font-size:12px;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:var(--card)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--grid)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.read{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:760px){.read{grid-template-columns:1fr}}
.ro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.ro .nm{font-weight:700;font-size:14px}
.ro .st{font-size:12px;color:var(--muted)}
.ro .vals{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:6px;font-size:13.5px}
.ro .vals .k{color:var(--muted)}
.ro .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.lv{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin:3px 4px 0 0;background:var(--tc,var(--t0));color:var(--ink)}
[data-lv="0"]{--tc:var(--t0)} [data-lv="1"]{--tc:var(--t1)} [data-lv="2"]{--tc:var(--t2)} [data-lv="3"]{--tc:var(--t3)} [data-lv="4"]{--tc:var(--t4)}
.lv[data-lv="3"], .lv[data-lv="4"]{color:#fff}
:root[data-theme="dark"] .lv[data-lv="4"]{color:#151515}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv[data-lv="4"]{color:#151515}}

/* building threat cards */
.bcards{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.bhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.bhead h3{font-size:20px;font-weight:900}
.bhead .st{color:var(--muted)}
.bgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;margin-top:10px}
@media (max-width:900px){.bgrid{grid-template-columns:1fr}}
.keys{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.keys li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;align-items:start}
.keys .when{font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap;padding-top:1px}
.keys .what{color:var(--ink2);font-size:14px}
.keys .what b{color:var(--ink)}
.tl svg{width:100%;height:auto;display:block}
.tl text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.tl .rl{font-family:var(--text);font-size:11px;fill:var(--ink2)}
.todo{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--alert-fill);background:var(--alert-bg);border-radius:0 8px 8px 0;color:var(--alert-ink);font-size:14px}
.todo ul{margin:4px 0 0;padding-left:18px}

.method{columns:2 360px;column-gap:28px;color:var(--ink2);font-size:14px}
.method p{margin:0 0 10px;break-inside:avoid}
footer{padding-block:22px 40px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<header class="bar"><div class="wrap">
  <a class="brand" href="#top">SIMON <small><span class="en" lang="en">and Vallarta</span><span class="es" lang="es">y Vallarta</span></small></a>
  <div class="lang" role="group" aria-label="Language and units / Idioma y unidades">
    <button type="button" data-lang="en" aria-pressed="false">English<small>mph · in</small></button>
    <button type="button" data-lang="es" aria-pressed="false">Español<small>km/h · mm</small></button>
    <button type="button" data-lang="both" aria-pressed="true">Both<small>ambos</small></button>
  </div>
</div></header>

<div class="alert"><div class="wrap">
  <span class="tag" id="alert-tag"></span>
  <p id="alert-text"></p>
</div></div>

<main id="top">
<section class="hero"><div class="wrap">
  <div class="eyebrow" id="asof"></div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="now" id="now"></div>
</div></section>

<section class="block" id="player" aria-label="Animated map / Mapa animado"><div class="wrap">
  <h2 id="ph2"></h2>
  <p class="sub" id="psub"></p>
  <div class="ctl">
    <div class="seg" role="group" id="scen-seg"></div>
    <button class="btn" type="button" id="play" aria-pressed="false"></button>
    <div class="seg" role="group" id="speed-seg"></div>
    <div class="seg" role="group" id="loop-seg"></div>
  </div>
  <div class="clock" aria-live="polite"><span class="when" id="when"></span><span class="badge" id="badge"></span><span class="rel" id="rel"></span></div>
  <div class="scrub"><input type="range" id="scrub" min="0" max="1" step="1" value="0" aria-label="Time / Hora"><div class="scrubbar" id="scrubbar"></div></div>
  <div class="panels">
    <div class="panel">
      <div class="ph"><h3 id="sat-h"></h3><span class="eyebrow" id="sat-tag"></span></div>
      <div class="stage" id="sat-stage" style="aspect-ratio:1/1"><canvas id="sat-cv"></canvas></div>
      <div class="legend" id="sat-legend"></div>
    </div>
    <div class="panel">
      <div class="ph"><div class="seg" role="group" id="view-seg"></div><div class="layers" id="layer-chips"></div></div>
      <div class="stage" id="map-stage"><canvas id="map-cv"></canvas><canvas id="wind-cv"></canvas></div>
      <div class="legend" id="map-legend"></div>
    </div>
  </div>
  <div class="read" id="read"></div>
</div></section>

<section class="block" id="threats"><div class="wrap">
  <h2 id="th2"></h2>
  <p class="sub" id="tsub"></p>
  <div class="bcards" id="bcards"></div>
</div></section>

<section class="block" id="how"><div class="wrap">
  <h2 id="mh2"></h2>
  <div class="method" id="method" style="margin-top:12px"></div>
</div></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script type="application/json" id="map-data">__MAP_JSON__</script>
<script type="application/json" id="layers-data">__LAYERS_JSON__</script>
<script type="application/json" id="img-data">__IMG_JSON__</script>
<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('map-data').textContent);
var LY = JSON.parse(document.getElementById('layers-data').textContent);
var IM = JSON.parse(document.getElementById('img-data').textContent);
var root = document.documentElement;
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- language and units ----------
function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function L(en, es){ return en === es ? en : '<span class="en" lang="en">' + en + '</span><span class="es" lang="es">' + es + '</span>'; }
function LB(en, es){ return '<span class="bi">' + L(en, es) + '</span>'; }
function lang(){ return root.getAttribute('data-lang') || 'both'; }
function T(en, es){ var l = lang(); return l === 'es' ? es : l === 'en' ? en : en + ' / ' + es; }
var fmt = function(x, d){ return Number(x).toLocaleString('en-US', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); };
var fmtE = function(x, d){ return Number(x).toLocaleString('es-MX', {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0}); };
var U = {
  wind: function(k){ return L(fmt(k / 1.609) + ' mph', fmtE(k) + ' km/h'); },
  windN: function(k){ return [fmt(k / 1.609), fmtE(k)]; },
  rate: function(mm){ var i = mm / 25.4; return L((mm > 0 && i < 0.005 ? '&lt;0.01' : mm > 0 && i < 0.095 ? i.toFixed(2) : i.toFixed(1)) + ' in/h', (mm > 0 && mm < 0.05 ? '&lt;0.1' : fmtE(mm, mm < 10 && mm > 0 ? 1 : 0)) + ' mm/h'); },
  depth: function(mm){ return L(fmt(mm / 25.4, mm < 254 ? 1 : 0) + ' in', fmtE(mm) + ' mm'); },
  dist: function(km){ return L(fmt(km / 1.609, km < 16 ? 1 : 0) + ' mi', fmtE(km, km < 10 ? 1 : 0) + ' km'); },
  elev: function(m){ return L(fmt(m * 3.281) + ' ft', fmtE(m) + ' m'); },
  kt: function(kt){ return U.wind(kt * 1.852); }
};
var DAY_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], DAY_ES = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
var DAYL_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'], DAYL_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function ms(iso){ return Date.parse(iso.replace('Z', ':00Z')); }
function cst(iso){ return new Date(ms(iso) - 6 * 3600e3); }
function h12(h, m){ var ap = h < 12 ? 'am' : 'pm', hh = h % 12 || 12; return hh + (m ? ':' + String(m).padStart(2, '0') : '') + ' ' + ap; }
function tParts(iso, long){
  var d = cst(iso), h = d.getUTCHours(), m = d.getUTCMinutes(), w = d.getUTCDay();
  var en = (long ? DAYL_EN : DAY_EN)[w] + ' ' + (h === 12 && m === 0 ? 'noon' : h === 0 && m === 0 ? 'midnight' : h12(h, m));
  var es = (long ? DAYL_ES : DAY_ES)[w] + ' ' + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  return [en, es];
}
function tL(iso, long){ var p = tParts(iso, long); return L(p[0], p[1]); }
function tT(iso){ var p = tParts(iso); return T(p[0], p[1]); }
function round10(iso){ return iso; }
var COMP_EN = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'];
var COMP_ES = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'];
function comp(d){ var k = Math.round(((d % 360) + 360) % 360 / 22.5) % 16; return L(COMP_EN[k], COMP_ES[k]); }
function compT(d){ var k = Math.round(((d % 360) + 360) % 360 / 22.5) % 16; return T(COMP_EN[k], COMP_ES[k]); }
function cat(kt){ return kt >= 137 ? 5 : kt >= 113 ? 4 : kt >= 96 ? 3 : kt >= 83 ? 2 : kt >= 64 ? 1 : 0; }
function catL(kt){ var c = cat(kt); return c ? L('Category ' + c + ' hurricane', 'huracán categoría ' + c) : kt >= 34 ? L('tropical storm', 'tormenta tropical') : L('tropical depression', 'depresión tropical'); }
function catP(kt){ var c = cat(kt); return c ? ['Category ' + c + ' hurricane', 'huracán categoría ' + c] : kt >= 34 ? ['tropical storm', 'tormenta tropical'] : ['tropical depression', 'depresión tropical']; }
function r5(x){ return Math.max(5, Math.round(x / 5) * 5); }       // distances along a forecast track: nearest 5 mi / km, never false precision
var D8E = ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'], D8S = ['norte', 'noreste', 'este', 'sureste', 'sur', 'suroeste', 'oeste', 'noroeste'];
// start times floored to the half hour, like the videos ("Sunday ~7 am"), so a start is never shown later than computed
function onsetParts(iso){
  var d = new Date(Math.floor(ms(iso) / 1800e3) * 1800e3 - 6 * 3600e3), h = d.getUTCHours(), m = d.getUTCMinutes();
  return [(h === 12 && !m ? 'noon' : h === 0 && !m ? 'midnight' : h12(h, m)) + ' ' + DAYL_EN[d.getUTCDay()], (h === 1 ? 'la ' : 'las ') + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ' del ' + DAYL_ES[d.getUTCDay()]];
}
// NHC-style arrival of tropical-storm-force wind at Puerto Vallarta (from the wind speed probabilities): [most likely, earliest]; the day is named once when both fall on the same day
function toaParts(){
  var TOA = (D.wind_cal || {}).toa34; if (!TOA || !TOA.early || !TOA.likely) return null;
  var pl = onsetParts(TOA.likely), pe = onsetParts(TOA.early);

  return [pl, pe];
}

function geo(la1, lo1, la2, lo2){
  var r = Math.PI / 180, p1 = la1 * r, p2 = la2 * r, dl = (lo2 - lo1) * r;
  var d = 2 * 6371 * Math.asin(Math.sqrt(Math.pow(Math.sin((p2 - p1) / 2), 2) + Math.cos(p1) * Math.cos(p2) * Math.pow(Math.sin(dl / 2), 2)));

  return [d, (b + 360) % 360];
}
var WCAP = D.wind_cal && D.wind_cal.cap_kt ? D.wind_cal.cap_kt : 999;   // caps the wind near Puerto Vallarta at the 50-50 value of the NHC wind probabilities
function ctr(k, i){ var t = D.scen[k].track[i]; return {lat: t[0], lon: t[1], v: t[2], g: t[3], r34: t.slice(4, 8), r50: t.slice(8, 12), r64: t.slice(12, 16)}; }
function wind(c, la, lo, land){
  var gb = geo(c.lat, c.lon, la, lo), km = gb[0], brg = gb[1], r = km / 1.852;
  var x = ((brg - 45 + 360) % 360) / 90, i = Math.floor(x) % 4, w = x - Math.floor(x);
  function tw(q){ return q[i] * (1 - w) + q[(i + 1) % 4] * w; }
  var r64 = tw(c.r64), r50 = tw(c.r50), r34 = tw(c.r34), vmax = c.v;
  var rmw = r64 > 0 ? Math.max(8, 0.5 * r64) : 10, kn = [[rmw, vmax]];
  [[r64, 64], [r50, 50], [r34, 34]].forEach(function(p){ if (vmax > p[1] && p[0] > kn[kn.length - 1][0]) kn.push(p); });
  var v;
  if (r <= rmw) v = vmax * r / rmw;
  else if (r >= kn[kn.length - 1][0]) v = kn[kn.length - 1][1] * kn[kn.length - 1][0] / r;
  else for (var j = 0; j < kn.length - 1; j++){ if (kn[j][0] <= r && r <= kn[j + 1][0]){ v = kn[j][1] + (kn[j + 1][1] - kn[j][1]) * (r - kn[j][0]) / (kn[j + 1][0] - kn[j][0]); break; } }
  var toward = brg - 90 - (land ? 35 : 20), dpv = geo(PV[0], PV[1], la, lo)[0], wcap = Math.min(1, Math.max(0, (150 - dpv) / 70)); if (v > WCAP) v = v - (v - WCAP) * wcap;
  return {v: v, g: v * (c.v ? c.g / c.v : 1.25), toward: toward, from: (toward + 180 + 720) % 360, km: km, brg: brg};
}
var RQ = (function(){ var b = atob(D.rain.q), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; })();
var RK0 = D.rain.km0, RDK = D.rain.dkm, RN = D.rain.n, RS = D.rain.scale;
function tm(v){ return 3.96 + 2.45 * (1 + (v - 35) / 33); }
function rscale(c, i){ return i < NOBS ? 1 : tm(c.v) / tm(D.V0); }
function rain(c, la, lo, sc){
  var dy = (la - c.lat) * 111.2, dx = (lo - c.lon) * 111.2 * Math.cos(c.lat * Math.PI / 180);
  var fi = (dx - RK0) / RDK, fj = (-dy - RK0) / RDK;
  if (!(fi >= 0 && fi < RN - 1 && fj >= 0 && fj < RN - 1)) return 0;
  var i = Math.floor(fi), j = Math.floor(fj), a = fi - i, b = fj - j, q = function(jj, ii){ return RQ[jj * RN + ii] / RS; };
  return (q(j, i) * (1 - a) * (1 - b) + q(j, i + 1) * a * (1 - b) + q(j + 1, i) * (1 - a) * b + q(j + 1, i + 1) * a * b) * sc;
}

  var lab = [[NOW / (N - 1), L('now', 'ahora'), 3]];
  for (var i = NOBS; i < N; i++){ var d = cst(TIMES[i]); if (d.getUTCMinutes() === 0 && d.getUTCHours() === 0) lab.push([i / (N - 1), L(DAY_EN[d.getUTCDay()], DAY_ES[d.getUTCDay()]), 2]); }
  lab.push([1, L('Mon noon', 'lun 12:00'), 3]); lab.push([0, '−4 h', 1]);
  lab.sort(function(a, b){ return b[2] - a[2]; });
  bar.innerHTML = lab.map(function(l){ return '<span style="' + (l[0] === 1 ? 'right:0;left:auto;transform:none' : l[0] === 0 ? 'left:0;transform:none' : 'left:' + (l[0] * 100).toFixed(2) + '%') + '">' + l[1] + '</span>'; }).join('');
  var kept = [];                        // drop lower-priority labels that collide with ones already kept
  Array.prototype.slice.call(bar.children).forEach(function(el){
    var r = el.getBoundingClientRect();
    if (kept.some(function(k){ return r.left < k.right + 6 && k.left < r.right + 6; })) el.remove(); else kept.push(r);
  });
}
function setI(i){ S.i = Math.max(0, Math.min(N - 1, i)); scrub.value = S.i; frame(); }
scrub.addEventListener('input', function(){ stop(); S.i = +scrub.value; frame(); });

var timer = null, last = 0;
function tick(ts){
  if (!S.playing) return;
  var stepMs = (S.i < NOBS ? 260 : 140) / S.speed;
  if (ts - last >= stepMs){
    last = ts; var ni = S.i + 1;
    if (S.loop === 'obs'){ if (ni > NOW) ni = 0; }
    else if (ni >= N) ni = 0;
    S.i = ni; scrub.value = ni; frame();
  }
  timer = requestAnimationFrame(tick);
}
function play(){ S.playing = true; last = 0; buildPlay(); timer = requestAnimationFrame(tick); }
function stop(){ S.playing = false; if (timer) cancelAnimationFrame(timer); buildPlay(); }
function buildPlay(){ var pb = document.getElementById('play'); pb.innerHTML = S.playing ? L('❚❚ Pause', '❚❚ Pausa') : L('▶ Play', '▶ Reproducir'); pb.setAttribute('aria-pressed', S.playing); }

           'En el 8.º piso recibes todo el viento sin nada que lo frene. La flecha indica hacia dónde sopla el viento: los vidrios del lado contrario a la punta, los que le dan la cara al viento, reciben más, y la dirección gira conforme pasa el centro. Mientras sople fuerte, quédate en un cuarto o pasillo interior lejos de las ventanas, con las puertas cerradas. Es probable que fallen la luz y las bombas de agua: no dependas del elevador. Los deslaves en las laderas de Amapas y el agua que baja por la calle pueden cortar el paso por horas.'],

            'Los edificios de 8 pisos a tu alrededor frenan el viento sostenido, pero lo vuelven racheado y arremolinado, más fuerte cuando se alinea con Francisca Rodríguez (oriente–poniente). El peligro mayor viene de arriba: tinacos, calentadores solares, letreros, vidrios y láminas que se desprenden de los edificios altos. No salgas si de pronto hay calma: si el ojo pasa cerca, el viento regresa del otro lado. Estar en alto aleja la inundación de tu puerta, pero las calles de abajo bajan con agua y el Río Cuale crece rápido.'],
  pitillal: ['At street level the danger is water. The Río Pitillal is 525 ft away and drains about {PIT_MI} sq mi of sierra; its crest comes about 3 hours after the heaviest rain up there, so it can keep rising after the rain eases in town. Move documents, medicine and valuables upstairs now. If Protección Civil calls for evacuation, go right away. If water rises in the street, shut off the power at the breaker before it gets into the house (never while standing in water) and go to the second floor. Never walk or drive through moving water.',
             'A nivel de calle el peligro es el agua. El Río Pitillal está a 160 m y recoge unos {PIT_KM} km² de sierra; su creciente llega unas 3 horas después de la lluvia más fuerte allá arriba, así que puede seguir subiendo aunque en el pueblo ya llueva menos. Sube ahora documentos, medicinas y objetos de valor. Si Protección Civil pide evacuar, sal de inmediato. Si el agua sube en la calle, baja el interruptor general antes de que entre a la casa (nunca parado en agua) y sube al segundo piso. Nunca cruces a pie ni en auto el agua en movimiento.']
};
function advice(id, k){ var a = D.basins.pitillal.area_km2; return ADVICE[id][k].replace('{PIT_MI}', fmt(a / 2.59)).replace('{PIT_KM}', fmtE(a)); }
var TROWS = [['wind', 'Wind at your level', 'Viento a tu altura'], ['windows', 'North windows', 'Ventanas al norte'], ['rate', 'Rain intensity', 'Intensidad de lluvia'], ['runoff', 'Street runoff', 'Agua en calles'], ['river', 'River', 'Río'], ['slide', 'Landslide', 'Deslave']];
var TSHORT = {wind: ['Wind', 'Viento'], windows: ['North windows', 'Ventanas norte'], rate: ['Rain rate', 'Lluvia'], runoff: ['Street runoff', 'Agua en calles'], river: ['River', 'Río'], slide: ['Landslide', 'Deslave']};
// width the timeline gets inside its card: the whole card below 900 px, else the 7/12 column (34 = card padding + border, 16 = column gap)
function tlWidth(){ var cw = document.getElementById('bcards').clientWidth - 34; return window.matchMedia && matchMedia('(max-width:900px)').matches ? cw : (cw - 16) * 7 / 12; }
function tlSVG(b){
  var sd = b.scen[S.scen], rows = TROWS.filter(function(r){ return sd.lv[r[0]]; }), en = lang() !== 'es';
  var tw = tlWidth(), narrow = tw < 560;   // narrow: draw 1:1 so the text keeps its size, with short row labels and 12-hour ticks
  var W = narrow ? Math.max(240, Math.round(tw)) : 640, x0 = narrow ? 92 : 112, x1 = W - 14, top = 8, gh = 70, rh = 13, H = top + gh + 14 + rows.length * (rh + 3) + 18;
  var X = function(i){ return x0 + (x1 - x0) * i / (N - 1); }, o = '';
  // night shading (6 pm – 6 am CST)
  for (var i = 0; i < N; i++){ var d = cst(TIMES[i]), hr = d.getUTCHours() + d.getUTCMinutes() / 60; if (hr >= 18 || hr < 6) o += '<rect x="' + X(i).toFixed(1) + '" y="' + top + '" width="' + ((x1 - x0) / (N - 1) + 0.3).toFixed(1) + '" height="' + (H - top - 18) + '" fill="var(--night)"/>'; }
  var gmax = Math.max.apply(null, sd.gb.slice(NOBS)), rmax = Math.max.apply(null, sd.rate.slice(NOBS));
  var gtop = Math.max(80, Math.ceil(gmax / 40) * 40), rtop = Math.max(10, Math.ceil(rmax / 10) * 10);
  for (var i2 = NOBS; i2 < N; i2++){ var hgt = sd.rate[i2] / rtop * gh; if (hgt > 0.2) o += '<rect x="' + X(i2).toFixed(1) + '" y="' + (top + gh - hgt).toFixed(1) + '" width="' + ((x1 - x0) / (N - 1) + 0.2).toFixed(1) + '" height="' + hgt.toFixed(1) + '" fill="var(--rainbar)" opacity=".55"/>'; }
  var pts = []; for (var i3 = 0; i3 < N; i3++) pts.push(X(i3).toFixed(1) + ',' + (top + gh - sd.gb[i3] / gtop * gh).toFixed(1));
  o += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--gust)" stroke-width="2"/>';
  // no axis-top number (it read like a forecast gust); a dotted line marks this building's strongest gust, the same value as in the list
  var gy = top + gh - gmax / gtop * gh, gl = Math.max(top + 9, gy + 3.5), ry = gl - top < 20 ? gl + 12 : top + 9;
  o += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + gy.toFixed(1) + '" y2="' + gy.toFixed(1) + '" stroke="var(--gust)" stroke-dasharray="2 3" opacity=".6"/>';
  o += '<text x="' + (x0 - 6) + '" y="' + gl.toFixed(1) + '" text-anchor="end" style="fill:var(--gust)">' + (en ? 'max ' + U.windN(gmax)[0] + ' mph' : 'máx. ' + U.windN(gmax)[1] + ' km/h') + '</text>';
  o += '<text x="' + (x0 - 6) + '" y="' + ry.toFixed(1) + '" text-anchor="end" style="fill:var(--rainbar)">' + (en ? (rtop / 25.4).toFixed(1) + ' in/h' : rtop + ' mm/h') + '</text>';
  o += '<text class="rl" x="' + (x0 - 6) + '" y="' + (top + gh - 2) + '" text-anchor="end" style="fill:var(--gust)">' + (en ? 'gusts' : 'ráfagas') + '</text>';
  o += '<line x1="' + x0 + '" x2="' + x1 + '" y1="' + (top + gh) + '" y2="' + (top + gh) + '" stroke="var(--line)"/>';
  rows.forEach(function(r, k){
    var y = top + gh + 14 + k * (rh + 3), a = sd.lv[r[0]];
    o += '<text class="rl" x="' + (x0 - 6) + '" y="' + (y + 10) + '" text-anchor="end">' + (narrow ? TSHORT[r[0]][en ? 0 : 1] : en ? r[1] : r[2]) + '</text>';
    o += '<rect x="' + x0 + '" y="' + y + '" width="' + (x1 - x0) + '" height="' + rh + '" fill="var(--t0)"/>';
    var s0 = null;
    for (var i4 = 0; i4 <= N; i4++){
      var lv = i4 < N ? a[i4] : -1;
      if (s0 === null || lv !== a[s0]){ if (s0 !== null && a[s0] > 0) o += '<rect x="' + X(s0).toFixed(1) + '" y="' + y + '" width="' + (X(i4) - X(s0)).toFixed(1) + '" height="' + rh + '" fill="var(--t' + a[s0] + ')"/>'; s0 = i4; }
    }
  });
  var yb = H - 4;
  for (var i5 = 0; i5 < N; i5++){ var d5 = cst(TIMES[i5]); if (d5.getUTCMinutes() === 0 && d5.getUTCHours() % (narrow ? 12 : 6) === 0) o += '<text x="' + X(i5).toFixed(1) + '" y="' + yb + '" text-anchor="middle">' + (d5.getUTCHours() === 0 ? (en ? DAY_EN : DAY_ES)[d5.getUTCDay()] : en ? h12(d5.getUTCHours()).replace(' ', '') : d5.getUTCHours() + 'h') + '</text>'; }
  o += '<line class="cur" x1="' + X(S.i) + '" x2="' + X(S.i) + '" y1="' + top + '" y2="' + (H - 16) + '" stroke="var(--ink)" stroke-width="1.5"/>';
  o += '<line x1="' + X(NOW) + '" x2="' + X(NOW) + '" y1="' + top + '" y2="' + (H - 16) + '" stroke="var(--obs)" stroke-dasharray="3 3"/>';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + T('Threat timeline', 'Línea de tiempo de amenazas') + '" data-x0="' + x0 + '" data-x1="' + x1 + '">' + o + '</svg>';
}
function cursor(){
  document.querySelectorAll('.tl svg').forEach(function(sv){ var x0 = +sv.getAttribute('data-x0'), x1 = +sv.getAttribute('data-x1'), x = x0 + (x1 - x0) * S.i / (N - 1), l = sv.querySelector('.cur'); if (l){ l.setAttribute('x1', x); l.setAttribute('x2', x); } });
}
function renderCards(){
  var h = '';
  B.forEach(function(b){
    var sd = b.scen[S.scen];
    h += '<article class="bcard"><div class="bhead"><h3>' + L(b.hood[0], b.hood[1]) + '</h3><span class="st">' + L(b.name[0], b.name[1]) + ' · ' + L(b.story[0], b.story[1]) + ' · ' + L('ground ~', 'terreno ~') + U.elev(b.elev_m) + ', ' + L('slope ', 'pendiente ') + Math.round(b.slope_deg) + '°</span></div>'
      + '<div class="bgrid"><ul class="keys">' + keyItems(b).map(function(it){ return '<li><span class="when">' + tL(it[0]) + '</span><span class="what">' + it[1] + '</span></li>'; }).join('') + '</ul>'
      + '<div><div class="tl">' + tlSVG(b) + '</div><div class="todo"><b>' + L('What this means here', 'Qué significa aquí') + '</b><br>' + L(advice(b.id, 0), advice(b.id, 1)) + '</div></div></div></article>';
  });
  document.getElementById('bcards').innerHTML = h;
}

// ---------- static text ----------
function texts(){
  document.getElementById('ph2').innerHTML = L('Satellite loop and street map', 'Satélite y mapa de calles');
  document.getElementById('psub').innerHTML = L('Left: the last four hours of GOES-18 infrared images, then the newest image carried along the track. Right: wind and rain over Vallarta at the same moment. Pick a neighborhood to zoom in to street level. Arrows on the buildings show where the wind is blowing.',
    'Izquierda: las últimas cuatro horas de imágenes infrarrojas de GOES-18; después, la imagen más reciente se desplaza sobre la trayectoria. Derecha: viento y lluvia sobre Vallarta en el mismo momento. Elige una colonia para ver las calles. Las flechas en los edificios indican hacia dónde sopla el viento.');
  document.getElementById('sat-h').innerHTML = L('GOES-18 infrared', 'GOES-18 infrarrojo');
  document.getElementById('th2').innerHTML = L('When the threats arrive at each building', 'Cuándo llegan las amenazas a cada edificio');
  var TA = toaParts(), toa = TA ? ['From the NHC wind speed probabilities, tropical-storm-force wind (39 mph or more) is most likely to begin in Vallarta around ' + TA[0][0] + ' and could begin as early as ' + TA[1][0] + '. The times below are our own estimate for each building at the height of your floor, so they can differ from the NHC times, and all of them can shift by hours with each advisory. Aim to be ready before the earliest time. ',
    'Según las probabilidades de viento del NHC, lo más probable es que el viento de tormenta tropical (63 km/h o más) empiece en Vallarta alrededor de ' + TA[0][1] + ', y podría empezar desde ' + TA[1][1] + '. Las horas de abajo son nuestra estimación para cada edificio, a la altura de tu piso; pueden diferir de las del NHC y todas pueden moverse varias horas con cada boletín. Ten todo listo antes de la hora más temprana. '] : ['', ''];
  document.getElementById('tsub').innerHTML = L('Times are Vallarta time (CST). ' + toa[0] + 'The bars show threat level (low, moderate, high, extreme), the purple line shows gusts at your floor and the blue bars show rain. Switch tracks above to compare.',
    'Horas del centro (Vallarta). ' + toa[1] + 'Las barras muestran el nivel de amenaza (baja, moderada, alta, extrema), la línea morada las ráfagas a la altura de tu piso y las barras azules la lluvia. Cambia de trayectoria arriba para comparar.');
  document.getElementById('mh2').innerHTML = L('How this was made', 'Cómo se hizo');
  var M = D.motion;
  var P1 = L('<b>The eye.</b> Every GOES-18 band-13 infrared image (one-minute mesoscale sector, one image every 10 minutes) was searched for the eye: the warm spot inside the cold eyewall. Its position was corrected for parallax, since from the satellite’s angle a 9-mile-high cloud top appears about 8 miles out of place. A straight line through the last ' + fmt(M.hours, 1) + ' hours of fixes gives the heading and speed (scatter about ' + fmt(M.resid_km / 1.609, 1) + ' mi).',
    '<b>El ojo.</b> En cada imagen infrarroja (banda 13) de GOES-18, del sector de mesoescala de un minuto, una cada 10 minutos, se buscó el ojo: el punto cálido dentro de la pared fría. La posición se corrigió por paralaje, porque desde el ángulo del satélite un tope de nube a 14 km de altura aparece desplazado unos 13 km. Una recta por las posiciones de las últimas ' + fmtE(M.hours, 1) + ' horas da el rumbo y la velocidad (dispersión de unos ' + fmtE(M.resid_km, 1) + ' km).');
  var P2 = L('<b>The extrapolation.</b> The eye is carried forward on that line at that speed, with no turns, which is what “if it keeps doing what it’s doing” means. Its strength is never allowed above the NHC forecast for the same hour; once the center crosses the coastline it also fades at the standard inland-decay rate (Kaplan & DeMaria), which is likely too slow over mountains this steep. The NHC track is the official forecast as issued and is not an average.',
    '<b>La extrapolación.</b> El ojo se lleva hacia adelante sobre esa recta a esa velocidad, sin giros: eso significa “si sigue como va”. Su fuerza nunca supera la del pronóstico del NHC para la misma hora; cuando el centro cruza la costa, además se debilita al ritmo estándar de decaimiento sobre tierra (Kaplan y DeMaria), que en montañas tan abruptas probablemente se queda corto. La trayectoria del NHC es el pronóstico oficial tal como se publicó; no es un promedio.');
  var P3 = L('<b>Rain.</b> GOES-18 rain-rate estimates from the last 2 hours (' + D.rain.scans.length + ' scans) were stacked around the eye and carried along each track. This is the method of NOAA’s tropical rainfall potential (TRaP). Rates are scaled down as the storm weakens, following the intensity relation in NOAA’s R-CLIPER model. Satellite estimates run high in intense cores, so the whole field is scaled (×' + (D.rain.cal || 1).toFixed(2) + ') so that the wettest 24 hours at these three sites match the top of the SMN forecast for coastal Jalisco (6–10 in). Mountains wring out extra rain this method cannot see. For comparison, the NHC calls for 10–20 in over portions of southwestern Mexico, locally 30 in.',
    '<b>Lluvia.</b> Las estimaciones de intensidad de lluvia de GOES-18 de las últimas 2 horas (' + D.rain.scans.length + ' barridos) se apilaron alrededor del ojo y se llevan sobre cada trayectoria. Es el método del potencial de lluvia tropical de NOAA (TRaP). La intensidad baja conforme la tormenta se debilita, según la relación del modelo R-CLIPER de NOAA. El satélite sobrestima en núcleos intensos, así que todo el campo se escala (×' + (D.rain.cal || 1).toFixed(2) + ') para que las 24 horas más lluviosas en estos tres sitios coincidan con el máximo del pronóstico del SMN para la costa de Jalisco (150–250 mm). Las montañas exprimen lluvia adicional que este método no ve. Para comparar, el NHC pronostica 250–500 mm en partes del suroeste de México, y hasta 760 mm en puntos aislados.');
  var PPw = D.wind_cal && D.wind_cal.probs, AMb = B.filter(function(b){ return b.id === 'amapas'; })[0];
  var AM = AMb ? Math.max.apply(null, AMb.scen.nhc.vb) : 0;   // km/h: peak 8th-floor sustained readout at Amapas on the NHC track
  var P4 = L('<b>Wind at your floor.</b> Wind around the eye comes from the NHC’s wind radii (39, 58 and 74 mph by quadrant), turned 20–35° inward. Near Vallarta, the open-water wind that the arrows and readouts start from (not the NHC wind-radius rings around the center) is capped at about ' + Math.round(WCAP * 1.15078 / 5) * 5 + ' mph. That is the 50-50 value we interpolate from the NHC wind speed probabilities' + (PPw ? ' (' + PPw['34'] + '% for 39 mph, ' + PPw['50'] + '% for 58 mph, ' + PPw['64'] + '% for 74 mph)' : '') + ': the center will not follow the track line exactly, and how strong it will be near Vallarta is not certain. Each building then gets the exposure factors engineers use for wind loads (ASCE 7). On an 8th floor the wind is about 0.9× the open-water wind when it crosses the city and 1.08× when it comes off the bay, so on the NHC track the Amapas readout can reach about ' + Math.round(AM / 1.609 / 5) * 5 + ' mph. A 3rd floor among taller buildings gets 0.77×, and street level 0.70×. Gusts are 1.25–1.45× the sustained wind. Surrounding towers make gusts swirl in ways no simple factor captures.',
    '<b>Viento a la altura de tu piso.</b> El viento alrededor del ojo sale de los radios de viento del NHC (63, 93 y 119 km/h por cuadrante), girado 20–35° hacia adentro. Cerca de Vallarta, el viento de mar abierto del que parten las flechas y las lecturas (no los anillos de radios de viento del NHC alrededor del centro) se limita a unos ' + Math.round(WCAP * 1.852 / 5) * 5 + ' km/h, el valor 50-50 que interpolamos de las probabilidades de viento del NHC' + (PPw ? ' (' + PPw['34'] + '% para 63 km/h, ' + PPw['50'] + '% para 93 km/h, ' + PPw['64'] + '% para 119 km/h)' : '') + ': el centro no seguirá exactamente la línea de la trayectoria y tampoco es segura la fuerza que tendrá al pasar cerca de Vallarta. Después, a cada edificio se le aplican los factores de exposición que los ingenieros usan para cargas de viento (ASCE 7). En un 8.º piso el viento es cerca de 0.9× el de mar abierto cuando cruza la ciudad y 1.08× cuando llega de la bahía, así que con la trayectoria del NHC la lectura de Amapas puede llegar a unos ' + Math.round(AM / 5) * 5 + ' km/h. Un 3.er piso entre edificios más altos recibe 0.77× y el nivel de calle, 0.70×. Las ráfagas son 1.25–1.45× el sostenido. Las torres vecinas hacen remolinos que ningún factor simple captura.');
  var P5 = L('<b>Rivers and landslides.</b> Catchments were traced from terrain data: Río Pitillal drains ' + fmt(D.basins.pitillal.area_km2 / 2.59) + ' sq mi and Río Cuale ' + fmt(D.basins.cuale.area_km2 / 2.59) + ' sq mi of sierra. River threat uses catchment rain over 6 hours, lagged 3 hours for the water to reach town (thresholds 0.8 / 1.6 / 2.8 / 4.3 in). Landslide threat compares rain with the Caine (1980) intensity–duration threshold on slopes steeper than 22°. Both are rough guides, not river or slope forecasts.',
    '<b>Ríos y deslaves.</b> Las cuencas se trazaron con datos de terreno: el Río Pitillal recoge ' + fmtE(D.basins.pitillal.area_km2) + ' km² y el Río Cuale ' + fmtE(D.basins.cuale.area_km2) + ' km² de sierra. La amenaza de río usa la lluvia en la cuenca en 6 horas, con 3 horas de retraso para que el agua llegue al pueblo (umbrales 20 / 40 / 70 / 110 mm). La de deslave compara la lluvia con el umbral de intensidad y duración de Caine (1980) en laderas de más de 22°. Ambas son guías aproximadas, no pronósticos del río ni de las laderas.');
  var P6 = L('<b>Sources.</b> NOAA GOES-18 ABI (CMIPM band 13, RRQPEF) from the NOAA Open Data bucket. NHC advisory ' + D.advisory.num + ': public advisory, forecast/advisory, discussion and wind speed probabilities. SMN-CONAGUA rain forecast. Terrain from AWS Terrain Tiles; streets, buildings and coastline © OpenStreetMap contributors (ODbL).',
    '<b>Fuentes.</b> NOAA GOES-18 ABI (CMIPM banda 13, RRQPEF) del repositorio de datos abiertos de NOAA. Productos del boletín ' + D.advisory.num + ' del NHC: aviso público, pronóstico, discusión y probabilidades de velocidad del viento. Pronóstico de lluvia del SMN-CONAGUA. Terreno de AWS Terrain Tiles; calles, edificios y costa © colaboradores de OpenStreetMap (ODbL).');
  document.getElementById('method').innerHTML = [P1, P2, P3, P4, P5, P6].map(function(p){ return '<p>' + p + '</p>'; }).join('');
  document.getElementById('foot').innerHTML = L('Built ' + tParts(D.generated)[0] + ' CST. Not an official forecast. Follow Protección Civil Jalisco, SMN-CONAGUA and the NHC. ', 'Generado ' + tParts(D.generated)[1] + ' (hora del centro). No es un pronóstico oficial. Sigue a Protección Civil Jalisco, SMN-CONAGUA y al NHC. ')
    + '<a href="../">' + L('Hour-by-hour model forecast', 'Pronóstico de modelos hora por hora') + '</a>';
}

// ---------- language ----------
function setLang(l){
  root.setAttribute('data-lang', l); try { localStorage.setItem('simon-map-lang', l); } catch (e) {}
  document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === l); });
  root.lang = l === 'es' ? 'es' : 'en';
  statics = {}; legends(); renderCards(); scrubLabels(); frame();
}
document.querySelector('.lang').addEventListener('click', function(e){ var b = e.target.closest('button'); if (b) setLang(b.getAttribute('data-lang')); });

// keyboard: space toggles play when the focus is not on a control, arrows step inside the player
document.addEventListener('keydown', function(e){
  var tg = e.target, inter = tg.closest && tg.closest('button, input, select, textarea, a, [contenteditable]');
  if (e.key === ' ' && !inter && document.getElementById('player').contains(document.activeElement) === false){ /* leave page scrolling alone */ }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && tg.closest && tg.closest('#player') && tg.id !== 'scrub'){ e.preventDefault(); stop(); setI(S.i + (e.key === 'ArrowRight' ? 1 : -1)); }
});

// ---------- init ----------
var saved = null; try { saved = localStorage.getItem('simon-map-lang'); } catch (e) {}
root.setAttribute('data-lang', saved || 'both');
document.querySelectorAll('.lang button').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-lang') === (saved || 'both')); });
buildHead(); buildControls(); texts(); legends(); scrubLabels();
sizeSat(); sizeMap(); renderCards(); setI(0);
resetParticles(); requestAnimationFrame(animP);
var rt = null, cardW = document.getElementById('bcards').clientWidth;   // re-render the cards only when their width changes (not on phone URL-bar height changes)
window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(function(){ var w = mapCv.width, bw = document.getElementById('bcards').clientWidth; sizeSat(); sizeMap(); if (mapCv.width !== w) resetParticles(); if (bw !== cardW){ cardW = bw; renderCards(); } scrubLabels(); frame(); }, 120); });
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ statics = {}; frame(); });
if (!reduce) play();
})();
</script>
