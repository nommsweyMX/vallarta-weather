var LANG = 'es';

  if (line){ if (!dry) cx.fillText(line, x, y + n * lh); n++; } return n * lh; }

  var px = x, n = 0, glued = false; cx.font = '500 ' + size + 'px ' + (font || FT); var sw = cx.measureText(' ').width;

  var hs = (extra || []).map(function(s){ return wrap(s, 40, 0, W - 80, 18, 23, C.mute, 500, FT, true); }); var tot = hs.reduce(function(a, b){ return a + b; }, 0) + 30;

function pin(R, s){ var p = px(R, s.lat, s.lon); cx.fillStyle = SITE_COL[s.id]; cx.strokeStyle = '#0b0e13'; cx.lineWidth = 3; cx.beginPath(); cx.arc(p[0], p[1], 10, 0, 7); cx.fill(); cx.stroke(); return p; }
function sitePins(R, labels){ // Amapas and E. Zapata are 400 m apart (one pin pair, labels stacked); El Pitillal is 6 km north
  var ps = SITES.map(function(s){ return pin(R, s); }); if (labels === false) return;

    text(SITE_SHORT[s.id][LANG === 'es' ? 0 : 1], x, y, 21, SITE_COL[s.id], 800, left ? 'right' : 'left', FT, true); }); }
function trackLine(R, lw, marks){ var tr = BAY.track; clipMap(R); cx.lineWidth = lw || 5; cx.setLineDash([14, 10]); cx.strokeStyle = 'rgba(255,255,255,.9)'; cx.beginPath();
  tr.forEach(function(p, k){ var q = px(R, p[0], p[1]); k ? cx.lineTo(q[0], q[1]) : cx.moveTo(q[0], q[1]); }); cx.stroke(); cx.setLineDash([]);
  if (marks !== false) for (var k = BAY.n_obs; k < tr.length; k++){ var d = cst(BAY.times[k]); if (d.getUTCMinutes() !== 0 || d.getUTCHours() % 6) continue; var q = px(R, tr[k][0], tr[k][1]); if (q[0] < R.x + 10 || q[0] > R.x + R.w - 10 || q[1] < R.y + 10 || q[1] > R.y + R.h - 10) continue;

var LEFT_LABELS = {'Punta Mita': 1, 'Cabo Corrientes': 1, 'Yelapa': 1, 'Sayulita': 1, 'El Tuito': 1};

var SKIP_BAY = ['Amapas', 'Zona Romántica', 'Las Juntas', 'Ixtapa', 'Aeropuerto PVR', 'Centro PV', 'El Pitillal', 'Mismaloya'];

// ====================== 1. WIND ======================
