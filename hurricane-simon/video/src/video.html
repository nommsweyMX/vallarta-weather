<script>
'use strict';
// A calm bilingual explainer: Spanish (metric) above English (imperial). render(t) draws the frame at t seconds.
var D = JSON.parse(document.getElementById('map-data').textContent);
var LY = JSON.parse(document.getElementById('layers-data').textContent);

var WV = JSON.parse(document.getElementById('waves-data').textContent);
var COL = JSON.parse(document.getElementById('col-data').textContent);
var PROGRAM = '__PROGRAM__';      // 'risk' (why these areas are at risk) or 'forecast' (the Simon forecast)
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var W = 1920, H = 1080, PW = 760, VX = PW, VW = W - PW;      // left text panel, right visual
var C = {bg: '#0b0e13', panel: '#10141b', ink: '#f2f4f7', ink2: '#b9c3cf', mute: '#8792a0', line: '#2a313b', accent: '#7fb5ff', warm: '#ffc45c', ext: '#ffffff', nhc: '#ff9d5c',

var FT = '"Red Hat Text", sans-serif', FD = '"Red Hat Display", sans-serif', FM = '"Red Hat Mono", monospace';

// ---------- images ----------
var IMG = {};
function loadAll(){ return Promise.all(Object.keys(IMS).map(function(k){ return new Promise(function(res){ var im = new Image(); im.onload = function(){ IMG[k] = im; res(); }; im.onerror = function(){ res(); }; im.src = IMS[k]; }); })); }

// ---------- formatting ----------
var TIMES = D.times, NOBS = D.n_obs, NOW = NOBS - 1, N = TIMES.length;
function ms(iso){ return Date.parse(iso.replace('Z', ':00Z')); }
function cst(iso){ return new Date(ms(iso) - 6 * 3600e3); }
var DAY_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], DAY_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var DS_ES = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], DS_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function hrES(d){ return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); }
function hrEN(d){ var h = d.getUTCHours(), m = d.getUTCMinutes(); if (h === 0 && m === 0) return 'midnight'; if (h === 12 && m === 0) return 'noon'; return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? '\u00a0am' : '\u00a0pm'); }
function roundH(iso){ var t = ms(iso); return new Date(Math.round(t / 3600e3) * 3600e3 - 6 * 3600e3); }   // nearest hour, CST
function tES(iso){ var d = roundH(iso); return DAY_ES[d.getUTCDay()] + ' ~' + hrES(d); }

function hEN(iso){ return '~' + hrEN(roundH(iso)); }
// 'el domingo ~22:00' / 'la medianoche del domingo al lunes'; 'Sunday ~10 pm' / 'around midnight Sunday night'
function whenES(iso){ var d = roundH(iso); if (d.getUTCHours() === 0) return 'la medianoche del ' + DAY_ES[(d.getUTCDay() + 6) % 7] + ' al ' + DAY_ES[d.getUTCDay()]; return 'el ' + DAY_ES[d.getUTCDay()] + ' ~' + hrES(d); }
function whenEN(iso){ var d = roundH(iso); if (d.getUTCHours() === 0) return 'around midnight ' + DAY_EN[(d.getUTCDay() + 6) % 7] + ' night'; return DAY_EN[d.getUTCDay()] + ' ~' + hrEN(d); }
// onsets: floor to the half hour, so a start is never shown later than computed
function floorHH(iso){ return new Date(Math.floor(ms(iso) / 1800e3) * 1800e3 - 6 * 3600e3); }
function oES(iso){ var d = floorHH(iso); return DAY_ES[d.getUTCDay()] + ' ~' + hrES(d); }

// a range with day names only where needed: 'domingo de ~16:00 a ~22:00' / 'del domingo ~16:00 al lunes ~02:00'
function spanES(a, b){ var da = floorHH(a), db = roundH(b); return da.getUTCDay() === db.getUTCDay() ? DAY_ES[da.getUTCDay()] + ' de ~' + hrES(da) + ' a ~' + hrES(db) : 'del ' + DAY_ES[da.getUTCDay()] + ' ~' + hrES(da) + ' al ' + DAY_ES[db.getUTCDay()] + ' ~' + hrES(db); }
function spanEN(a, b){ var da = floorHH(a), db = roundH(b); return da.getUTCDay() === db.getUTCDay() ? DAY_EN[da.getUTCDay()] + ' ~' + hrEN(da) + ' to ~' + hrEN(db) : DAY_EN[da.getUTCDay()] + ' ~' + hrEN(da) + ' to ' + DAY_EN[db.getUTCDay()] + ' ~' + hrEN(db); }
var fE = function(x, d){ return Number(x).toLocaleString('es-MX', {maximumFractionDigits: d || 0, minimumFractionDigits: d || 0}); };
var fN = function(x, d){ return Number(x).toLocaleString('en-US', {maximumFractionDigits: d || 0, minimumFractionDigits: d || 0}); };
function geo(la1, lo1, la2, lo2){

var C16E = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'], C16S = ['norte', 'nor-noreste', 'noreste', 'este-noreste', 'este', 'este-sureste', 'sureste', 'sur-sureste', 'sur', 'sur-suroeste', 'suroeste', 'oeste-suroeste', 'oeste', 'oeste-noroeste', 'noroeste', 'nor-noroeste'];

function track(k, i){ var t = D.scen[k].track[i]; return {lat: t[0], lon: t[1], v: t[2]}; }

// ---------- facts computed from the data (both tracks, so every time is a range) ----------
var PV = [20.6100, -105.2345];
var B = {}; D.bldg.forEach(function(b){ B[b.id] = b; });
function win(id, key, th){       // earliest start, latest end of level >= th over both tracks

          vAt: Math.max(ce.v, cn.v), vAtMin: Math.min(ce.v, cn.v), cat: D.advisory.kt >= 113 ? 4 : 3,

          totMin: Math.min(B.amapas.scen.nhc.total, B.pitillal.scen.nhc.total), totMax: Math.max(B.amapas.scen.nhc.total, B.pitillal.scen.nhc.total)};
})();
var ADV = D.advisory;
function issuedES(){ var m = /^(\d{1,2})(\d{2}) ([AP])M/.exec(ADV.issued || ''); if (!m) return ''; var h = +m[1] % 12 + (m[3] === 'P' ? 12 : 0); return String(h).padStart(2, '0') + ':' + m[2]; }

var asofD = cst(FX.fx.t);
var ASOF_ES = DS_ES[asofD.getUTCDay()] + ' ' + asofD.getUTCDate() + ' oct, ' + hrES(asofD), ASOF_EN = DS_EN[asofD.getUTCDay()] + ' Oct ' + asofD.getUTCDate() + ', ' + hrEN(asofD);

// ---------- text drawing ----------

  words.forEach(function(wd){
    var ww = 0; wd.parts.forEach(function(pt){ cx.font = (pt.b ? '700 ' : '400 ') + size + 'px ' + FT; pt.w = cx.measureText(pt.t).width; ww += pt.w; });
    if (lw + ww > w && lines[lines.length - 1].length){ lines.push([]); lw = 0; }
    lines[lines.length - 1].push({parts: wd.parts, w: ww}); lw += ww + sp;
  });

  lines.forEach(function(ln, i){ var xx = x; ln.forEach(function(wd){ wd.parts.forEach(function(pt){ cx.font = (pt.b ? '700 ' : '400 ') + size + 'px ' + FT; cx.fillText(pt.t, xx, y + size + i * lh); xx += pt.w; }); xx += sp; }); });
  cx.restore();

}
function label(t, x, y, size, color, weight, align, halo){
  cx.save(); cx.font = (weight || 600) + ' ' + size + 'px ' + FT; cx.textAlign = align || 'left'; cx.textBaseline = 'middle';
  if (halo !== false){ cx.lineWidth = size / 3.4; cx.strokeStyle = 'rgba(8,10,14,.85)'; cx.lineJoin = 'round'; cx.strokeText(t, x, y); }

}
function ease(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// text panel: eyebrow title, Spanish block, English block, footer
function panel(sc, t){

  cx.fillStyle = C.line; cx.fillRect(PW - 1, 0, 1, H);
  var x = 64, w = PW - 128, y = 76;
  var si = 0; sc.steps.forEach(function(s, k){ if (t >= s.at) si = k; });
  var step = sc.steps[si], a = si === 0 ? ease(t / 0.7) : ease((t - step.at - 0.35) / 0.5);

  }
  var hEs = para(step.es, x, y, w, 35, 47, C.ink, false, a);
  y += hEs + 26; cx.fillStyle = C.line; cx.fillRect(x, y, 80, 2); y += 26;

  cx.fillText('Datos: ' + ASOF_ES + ' · No es pronóstico oficial', x, H - 74);

// ---------- map drawing ----------

var staticCache = {};

function marker(x, y, t, color, name, side){

// ---------- satellite ----------
var IRF = D.ir.frames;
function extLevels(r){

function satDraw(R, frame, shiftK, i, opts){

    var E = D.ir.ext, c0 = track(shiftK, NOW), c1 = track(shiftK, i), p0 = rp(c0.lat, c0.lon), p1 = rp(c1.lat, c1.lon), lv = extLevels(c1.v / D.V0), hh = R.w * E.ny / LY.reg.h;
    var ex = R.x + p1[0] - p0[0] + (E.lon0 !== undefined ? (E.lon0 - rb[2]) / (rb[3] - rb[2]) * R.w : 0), ew = E.lon1 !== undefined ? (E.lon1 - E.lon0) / (rb[3] - rb[2]) * R.w : R.w, ey = R.y + p1[1] - p0[1];

  var bt = FC.best, first = function(f){ for (var k = 0; k < bt.length; k++) if (f(bt[k])) return bt[k]; return null; };
  var peak = bt.reduce(function(a, b){ return b.kt > a.kt ? b : a; });

  return {pts: pts, at: at, t0: t0, pv: best, lf: lf, nc: nc, sm: sm, gen: bt[0], td: first(function(b){ return b.ty === 'TD'; }), ts: first(function(b){ return b.ty === 'TS'; }), hu: ri0, peak: peak,

var ORDER = ['title', 'category', 'overview', 'mountains', 'catchments', 'rivers', 'history', 'streets', 'coast', 'waves', 'wind', 'slopes', 'amapas', 'ezapata', 'pitillal', 'now', 'timeline', 'todo', 'credits'];

var T0 = [], TOTAL = 0; SC.forEach(function(s){ T0.push(TOTAL); TOTAL += s.dur; });
var XF = 0.6;     // crossfade seconds
function drawScene(k, t){ var s = SC[k]; cx.save(); s.draw(t); cx.restore(); if (!s.noPanel){ cx.save(); panel(s, t); cx.restore(); } }
function render(T){
  T = Math.max(0, Math.min(TOTAL - 1e-6, T));
  var k = 0; while (k < SC.length - 1 && T >= T0[k + 1]) k++;
  var t = T - T0[k];
  cx.globalAlpha = 1; cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
  drawScene(k, t);
  if (k > 0 && t < XF){ var oc = document.createElement('canvas'); oc.width = W; oc.height = H; var keep = cx; cx = oc.getContext('2d'); drawScene(k - 1, SC[k - 1].dur - 0.001); cx = keep; cx.globalAlpha = 1 - t / XF; cx.drawImage(oc, 0, 0); cx.globalAlpha = 1; }
  if (T > TOTAL - 1){ cx.fillStyle = 'rgba(0,0,0,' + (T - (TOTAL - 1)) + ')'; cx.fillRect(0, 0, W, H); }
}
window.VIDEO = {render: render, total: function(){ return TOTAL; }, scenes: function(){ return SC.map(function(s, k){ return {id: s.id, t0: T0[k], dur: s.dur, title: s.title || null, steps: s.steps}; }); }, ready: null};
