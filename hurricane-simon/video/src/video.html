<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simon y Vallarta · video</title>
<style>

canvas{display:block}
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<script type="application/json" id="map-data">__MAP_JSON__</script>
<script type="application/json" id="layers-data">__LAYERS_JSON__</script>
<script type="application/json" id="video-data">__VIDEO_JSON__</script>
<script type="application/json" id="atlas-data">__ATLAS_JSON__</script>
<script type="application/json" id="img-data">__IMG_JSON__</script>
<script>
'use strict';
// A calm bilingual explainer: Spanish (metric) above English (imperial). render(t) draws the frame at t seconds.
var D = JSON.parse(document.getElementById('map-data').textContent);
var LY = JSON.parse(document.getElementById('layers-data').textContent);
var VD = JSON.parse(document.getElementById('video-data').textContent);
var AT = JSON.parse(document.getElementById('atlas-data').textContent);
var IMS = JSON.parse(document.getElementById('img-data').textContent);
var cv = document.getElementById('cv'), cx = cv.getContext('2d');
var W = 1920, H = 1080, PW = 760, VX = PW, VW = W - PW;      // left text panel, right visual
var C = {bg: '#0b0e13', panel: '#10141b', ink: '#f2f4f7', ink2: '#b9c3cf', mute: '#8792a0', line: '#2a313b', accent: '#7fb5ff', warm: '#ffc45c', ext: '#ffffff', nhc: '#ff9d5c',
         t1: '#e9c75a', t2: '#e5a823', t3: '#e27a2e', t4: '#ff6b5a', water: '#5eb4ff', slope: '#e08a3c'};
var FT = '"Red Hat Text", sans-serif', FD = '"Red Hat Display", sans-serif', FM = '"Red Hat Mono", monospace';

// ---------- images ----------
var IMG = {};
function loadAll(){ return Promise.all(Object.keys(IMS).map(function(k){ return new Promise(function(res){ var im = new Image(); im.onload = function(){ IMG[k] = im; res(); }; im.onerror = function(){ res(); }; im.src = IMS[k]; }); })); }

// ---------- formatting ----------
var TIMES = D.times, NOBS = D.n_obs, NOW = NOBS - 1, N = TIMES.length;
function ms(iso){ return Date.parse(iso.replace('Z', ':00Z')); }
function cst(iso){ return new Date(ms(iso) - 6 * 3600e3); }
var DAY_ES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'], DAY_EN = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var DS_ES = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'], DS_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function hrES(d){ return String(d.getUTCHours()).padStart(2, '0') + ':' + String(d.getUTCMinutes()).padStart(2, '0'); }
function hrEN(d){ var h = d.getUTCHours(), m = d.getUTCMinutes(); if (h === 0 && m === 0) return 'midnight'; if (h === 12 && m === 0) return 'noon'; return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? ' am' : ' pm'); }
function roundH(iso){ var t = ms(iso); return new Date(Math.round(t / 3600e3) * 3600e3 - 6 * 3600e3); }   // nearest hour, CST
function tES(iso){ var d = roundH(iso); return DAY_ES[d.getUTCDay()] + ' ~' + hrES(d); }
function tEN(iso){ var d = roundH(iso); return DAY_EN[d.getUTCDay()] + ' ~' + hrEN(d); }
function hES(iso){ return '~' + hrES(roundH(iso)); }
function hEN(iso){ return '~' + hrEN(roundH(iso)); }
var fE = function(x, d){ return Number(x).toLocaleString('es-MX', {maximumFractionDigits: d || 0, minimumFractionDigits: d || 0}); };
var fN = function(x, d){ return Number(x).toLocaleString('en-US', {maximumFractionDigits: d || 0, minimumFractionDigits: d || 0}); };
function geo(la1, lo1, la2, lo2){
  var r = Math.PI / 180, p1 = la1 * r, p2 = la2 * r, dl = (lo2 - lo1) * r;
  var d = 2 * 6371 * Math.asin(Math.sqrt(Math.pow(Math.sin((p2 - p1) / 2), 2) + Math.cos(p1) * Math.cos(p2) * Math.pow(Math.sin(dl / 2), 2)));
  var b = Math.atan2(Math.sin(dl) * Math.cos(p2), Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl)) / r;
  return [d, (b + 360) % 360];
}
var C16E = ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'], C16S = ['norte', 'nor-noreste', 'noreste', 'este-noreste', 'este', 'este-sureste', 'sureste', 'sur-sureste', 'sur', 'sur-suroeste', 'suroeste', 'oeste-suroeste', 'oeste', 'oeste-noroeste', 'noroeste', 'nor-noroeste'];
var C16EN = ['north', 'north-northeast', 'northeast', 'east-northeast', 'east', 'east-southeast', 'southeast', 'south-southeast', 'south', 'south-southwest', 'southwest', 'west-southwest', 'west', 'west-northwest', 'northwest', 'north-northwest'];
function ci(d){ return Math.round(((d % 360) + 360) % 360 / 22.5) % 16; }
function track(k, i){ var t = D.scen[k].track[i]; return {lat: t[0], lon: t[1], v: t[2]}; }

// ---------- facts computed from the data (both tracks, so every time is a range) ----------
var PV = [20.6100, -105.2345];
var B = {}; D.bldg.forEach(function(b){ B[b.id] = b; });
function win(id, key, th){       // earliest start, latest end of level >= th over both tracks
  var s = null, e = null;
  ['ext', 'nhc'].forEach(function(k){ var a = B[id].scen[k].lv[key]; if (!a) return; for (var i = NOBS; i < N; i++) if (a[i] >= th){ if (s === null || i < s) s = i; break; } for (var j = N - 1; j >= NOBS; j--) if (a[j] >= th){ if (e === null || j > e) e = j; break; } });
  return s === null ? null : [TIMES[s], TIMES[e], e === N - 1];
}
function closestPV(k){ var best = {km: 1e9}; for (var i = NOBS; i < N; i++){ var c = track(k, i), g = geo(PV[0], PV[1], c.lat, c.lon); if (g[0] < best.km) best = {km: g[0], i: i, v: c.v}; } return best; }
var FX = (function(){
  var fx = D.fixes[D.fixes.length - 1], g = geo(PV[0], PV[1], fx.lat, fx.lon), M = D.motion, ce = closestPV('ext'), cn = closestPV('nhc');
  var c1 = ce.i < cn.i ? ce : cn, c2 = ce.i < cn.i ? cn : ce;
  // wind turning onshore (from the SW quadrant) at Amapas after the centre passes
  var shift = ['ext', 'nhc'].map(function(k){ var s = B.amapas.scen[k]; for (var i = NOBS; i < N; i++) if (s.frm[i] >= 180 && s.frm[i] <= 300 && s.v[i] > 30) return i; return null; }).filter(function(x){ return x !== null; });
  return {fx: fx, km: g[0], brg: g[1], kmh: M.kmh, dir: M.dir_to, c1: c1, c2: c2, shift: shift.length ? TIMES[Math.min.apply(null, shift)] : null,
          vAt: Math.max(ce.v, cn.v), vAtMin: Math.min(ce.v, cn.v), cat: D.advisory.kt >= 113 ? 4 : 3,
          wind2: win('amapas', 'wind', 2), wind3: win('amapas', 'wind', 3), windows3: win('amapas', 'windows', 3), rate3: [win('amapas', 'rate', 3), win('pitillal', 'rate', 3)],
          slide2: win('amapas', 'slide', 2), cuale3: win('ezapata', 'river', 3), pit3: win('pitillal', 'river', 3), run3p: win('pitillal', 'runoff', 3), run3z: win('ezapata', 'runoff', 3),
          totMin: Math.min(B.amapas.scen.ext.total, B.pitillal.scen.ext.total, B.amapas.scen.nhc.total, B.pitillal.scen.nhc.total), totMax: Math.max(B.amapas.scen.ext.total, B.pitillal.scen.ext.total, B.amapas.scen.nhc.total, B.pitillal.scen.nhc.total)};
})();
var ADV = D.advisory;
function issuedES(){ var m = /^(\d{1,2})(\d{2}) ([AP])M/.exec(ADV.issued || ''); if (!m) return ''; var h = +m[1] % 12 + (m[3] === 'P' ? 12 : 0); return String(h).padStart(2, '0') + ':' + m[2]; }
function issuedEN(){ var m = /^(\d{1,2})(\d{2}) ([AP])M/.exec(ADV.issued || ''); if (!m) return ''; var h = +m[1] % 12 || 12; return h + (m[2] !== '00' ? ':' + m[2] : '') + ' ' + m[3].toLowerCase() + 'm'; }
var asofD = cst(FX.fx.t);
var ASOF_ES = DS_ES[asofD.getUTCDay()] + ' ' + asofD.getUTCDate() + ' oct, ' + hrES(asofD), ASOF_EN = DS_EN[asofD.getUTCDay()] + ' Oct ' + asofD.getUTCDate() + ', ' + hrEN(asofD);

// ---------- text drawing ----------
// Rich text: *bold* segments. Returns the height used.
function para(text, x, y, w, size, lh, color, bold, alpha){
  var words = []; String(text).split(/(\*[^*]+\*)/).forEach(function(seg){ if (!seg) return; var b = seg[0] === '*' && seg[seg.length - 1] === '*', body = b ? seg.slice(1, -1) : seg, glue = !b && words.length && !/^\s/.test(body);
    body.split(/ +/).forEach(function(wd, k){ if (!wd) return; if (k === 0 && glue){ words[words.length - 1].parts.push({t: wd, b: b || bold}); return; } words.push({parts: [{t: wd, b: b || bold}]}); }); });
  var lines = [[]], lw = 0, sp;
  cx.font = '400 ' + size + 'px ' + FT; sp = cx.measureText(' ').width;
  words.forEach(function(wd){
    var ww = 0; wd.parts.forEach(function(pt){ cx.font = (pt.b ? '700 ' : '400 ') + size + 'px ' + FT; pt.w = cx.measureText(pt.t).width; ww += pt.w; });
    if (lw + ww > w && lines[lines.length - 1].length){ lines.push([]); lw = 0; }
    lines[lines.length - 1].push({parts: wd.parts, w: ww}); lw += ww + sp;
  });
  cx.save(); cx.globalAlpha = alpha === undefined ? 1 : alpha; cx.fillStyle = color; cx.textBaseline = 'alphabetic';
  lines.forEach(function(ln, i){ var xx = x; ln.forEach(function(wd){ wd.parts.forEach(function(pt){ cx.font = (pt.b ? '700 ' : '400 ') + size + 'px ' + FT; cx.fillText(pt.t, xx, y + size + i * lh); xx += pt.w; }); xx += sp; }); });
  cx.restore();
  return lines.length * lh;
}
function label(t, x, y, size, color, weight, align, halo){
  cx.save(); cx.font = (weight || 600) + ' ' + size + 'px ' + FT; cx.textAlign = align || 'left'; cx.textBaseline = 'middle';
  if (halo !== false){ cx.lineWidth = size / 3.4; cx.strokeStyle = 'rgba(8,10,14,.85)'; cx.lineJoin = 'round'; cx.strokeText(t, x, y); }
  cx.fillStyle = color; cx.fillText(t, x, y); cx.restore();
}
function ease(x){ x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }

// text panel: eyebrow title, Spanish block, English block, footer
function panel(sc, t){
  cx.fillStyle = C.panel; cx.fillRect(0, 0, PW, H);
  cx.fillStyle = C.line; cx.fillRect(PW - 1, 0, 1, H);
  var x = 64, w = PW - 128, y = 76;
  var si = 0; sc.steps.forEach(function(s, k){ if (t >= s.at) si = k; });
  var step = sc.steps[si], a = si === 0 ? ease(t / 0.7) : ease((t - step.at - 0.35) / 0.5);
  if (si > 0 && t - step.at < 0.35){ step = sc.steps[si - 1]; a = 1 - ease((t - sc.steps[si].at) / 0.35); }
  if (sc.title){
    cx.font = '700 22px ' + FM; cx.fillStyle = C.accent; cx.textBaseline = 'alphabetic'; cx.fillText(sc.title[0].toUpperCase(), x, y);
    cx.font = '500 22px ' + FM; cx.fillStyle = C.mute; cx.fillText(sc.title[1].toUpperCase(), x, y + 32); y += 74;
  }
  var hEs = para(step.es, x, y, w, 35, 47, C.ink, false, a);
  y += hEs + 26; cx.fillStyle = C.line; cx.fillRect(x, y, 80, 2); y += 26;
  para(step.en, x, y, w, 29, 39, C.ink2, false, a);
  // footer
  cx.font = '500 17px ' + FM; cx.fillStyle = C.mute; cx.textBaseline = 'alphabetic';
  cx.fillText('Datos: ' + ASOF_ES + ' · No es pronóstico oficial', x, H - 74);
  cx.fillText('Data: ' + ASOF_EN + ' CST · Not an official forecast', x, H - 46);
}

// ---------- map drawing ----------
function fitRect(iw, ih, pad){ var s = Math.min((VW - 2 * pad) / iw, (H - 2 * pad) / ih); var w = iw * s, h = ih * s; return {x: VX + (VW - w) / 2, y: (H - h) / 2, w: w, h: h, s: s}; }
function path(a, R, sc){ cx.moveTo(R.x + a[0] * sc, R.y + a[1] * sc); for (var j = 2; j < a.length; j += 2) cx.lineTo(R.x + a[j] * sc, R.y + a[j + 1] * sc); }
var staticCache = {};
function mapStatic(view, R){
  var key = view + R.w; if (staticCache[key]) return staticCache[key];
  var v = LY.views[view], oc = document.createElement('canvas'); oc.width = Math.round(R.w); oc.height = Math.round(R.h);
  var c = oc.getContext('2d'), s = oc.width / v.w; c.drawImage(IMG['base_' + view + '_dark'], 0, 0, oc.width, oc.height);
  c.setTransform(s, 0, 0, s, 0, 0); c.lineJoin = c.lineCap = 'round'; var ly = v.layers, city = view === 'city';
  c.fillStyle = '#16304a'; ly.water.forEach(function(a){ if (a.length > 6){ c.beginPath(); c.moveTo(a[0], a[1]); for (var j = 2; j < a.length; j += 2) c.lineTo(a[j], a[j + 1]); c.closePath(); c.fill(); } });
  if (ly.bldg.length) ly.bldg.forEach(function(b){ c.fillStyle = b[0] >= 6 ? '#59616d' : b[0] >= 3 ? '#454c56' : '#343a43'; c.beginPath(); c.moveTo(b[1], b[2]); for (var j = 3; j < b.length; j += 2) c.lineTo(b[j], b[j + 1]); c.closePath(); c.fill(); });
  c.strokeStyle = '#3d77a8'; c.lineWidth = city ? 1.4 : 5; ly.rivers.forEach(function(a){ c.beginPath(); c.moveTo(a[0], a[1]); for (var j = 2; j < a.length; j += 2) c.lineTo(a[j], a[j + 1]); c.stroke(); });
  var wd = city ? [2.2, 1.7, 1.2, 0.5, 0.45, 0.35] : [6, 5, 4, 3, 2, 1.2], col = ['#c8b27a', '#a99e86', '#8d949c', '#5e656e', '#4d535b', '#454a51'];
  for (var k = 5; k >= 0; k--) ly.roads[k].forEach(function(a){ c.strokeStyle = col[k]; c.lineWidth = wd[k]; c.beginPath(); c.moveTo(a[0], a[1]); for (var j = 2; j < a.length; j += 2) c.lineTo(a[j], a[j + 1]); c.stroke(); });
  c.strokeStyle = '#4f87b8'; c.lineWidth = city ? 1 : 2; ly.coast.forEach(function(a){ c.beginPath(); c.moveTo(a[0], a[1]); for (var j = 2; j < a.length; j += 2) c.lineTo(a[j], a[j + 1]); c.stroke(); });
  if (!city){ c.font = '500 ' + (13 / s * (R.w / 1000)) + 'px ' + FT; }
  staticCache[key] = oc; return oc;
}
function mpx(view, R, la, lo){ var v = LY.views[view], b = v.bbox; return [R.x + (lo - b[2]) / (b[3] - b[2]) * R.w, R.y + (b[0] - la) / (b[0] - b[1]) * R.h]; }
function marker(x, y, t, color, name, side){
  var p = 0.5 + 0.5 * Math.sin(t * 3);
  cx.save(); cx.strokeStyle = color; cx.globalAlpha = 0.6 * (1 - p); cx.lineWidth = 3; cx.beginPath(); cx.arc(x, y, 14 + 18 * p, 0, 7); cx.stroke(); cx.restore();
  cx.fillStyle = color; cx.strokeStyle = '#0b0e13'; cx.lineWidth = 3; cx.beginPath(); cx.arc(x, y, 10, 0, 7); cx.fill(); cx.stroke();
  if (name) label(name, x + (side === 'l' ? -20 : 20), y, 26, '#fff', 700, side === 'l' ? 'right' : 'left');
}

// ---------- satellite ----------
var IRF = D.ir.frames;
function satDraw(R, frame, shiftK, i, opts){
  opts = opts || {};
  var s = R.w / LY.reg.w, rb = LY.reg.bbox;
  cx.save(); cx.beginPath(); cx.rect(R.x, R.y, R.w, R.h); cx.clip();
  if (IMG.reg_base) cx.drawImage(IMG.reg_base, R.x, R.y, R.w, R.h);
  function rp(la, lo){ return [R.x + (lo - rb[2]) / (rb[3] - rb[2]) * R.w, R.y + (rb[0] - la) / (rb[0] - rb[1]) * R.h]; }
  if (shiftK){
    var c0 = track(shiftK, NOW), c1 = track(shiftK, i), p0 = rp(c0.lat, c0.lon), p1 = rp(c1.lat, c1.lon), ex = D.ir.ext && IMG[D.ir.ext.file];
    cx.globalAlpha = 0.92; if (ex) cx.drawImage(ex, R.x + p1[0] - p0[0], R.y + p1[1] - p0[1], R.w, R.w * D.ir.ext.ny / LY.reg.h); cx.globalAlpha = 1;
  } else if (IMG[IRF[frame]]) cx.drawImage(IMG[IRF[frame]], R.x, R.y, R.w, R.h);
  cx.fillStyle = 'rgba(255,214,120,.6)'; LY.reg.coast.forEach(function(p){ cx.fillRect(R.x + p[0] * s, R.y + p[1] * s, 1.6, 1.6); });
  if (opts.tracks){
    ['nhc', 'ext'].forEach(function(k){ cx.save(); cx.setLineDash(k === 'nhc' ? [14, 10] : []); cx.strokeStyle = k === 'nhc' ? C.nhc : C.ext; cx.lineWidth = 3.5; cx.globalAlpha = opts.tracks; cx.beginPath();
      for (var j = NOW; j < N; j += 3){ var c = track(k, j), p = rp(c.lat, c.lon); j === NOW ? cx.moveTo(p[0], p[1]) : cx.lineTo(p[0], p[1]); } cx.stroke(); cx.restore(); });
  }
  cx.fillStyle = '#5ff0b4'; D.fixes.forEach(function(f){ var p = rp(f.lat, f.lon); cx.beginPath(); cx.arc(p[0], p[1], 2.6, 0, 7); cx.fill(); });
  if (!opts.nopv){ var pv = rp(PV[0], PV[1]); cx.fillStyle = '#fff'; cx.strokeStyle = '#000'; cx.lineWidth = 2; cx.beginPath(); cx.arc(pv[0], pv[1], 7, 0, 7); cx.fill(); cx.stroke();
  label('Puerto Vallarta', pv[0] + 16, pv[1] - 4, 28, '#fff', 700); }
  if (opts.center !== false){ var cc = shiftK ? track(shiftK, i) : null, fx = D.fixes[D.fixes.length - 1], p = cc ? rp(cc.lat, cc.lon) : rp(fx.lat, fx.lon);
    cx.strokeStyle = '#fff'; cx.lineWidth = 3; cx.beginPath(); cx.arc(p[0], p[1], 9, 0, 7); cx.stroke(); }
  cx.restore();
}

// ---------- scenes ----------
var SC = [];
function scene(o){ SC.push(o); }
var r = function(x){ return Math.round(x); };
var kmE = r(FX.km), miE = r(FX.km / 1.609), spdK = r(FX.kmh), spdM = r(FX.kmh / 1.609);
var dirS = C16S[ci(FX.brg)], dirE = C16EN[ci(FX.brg)];
var LANDFIRST = ['ext', 'nhc'].every(function(k){ var lf = D.scen[k].landfall; return lf && TIMES.indexOf(lf) >= 0 && TIMES.indexOf(lf) < closestPV(k).i; });

scene({id: 'title', dur: 8, steps: [{at: 0, es: '', en: ''}], noPanel: true, draw: function(t){
  var R = {x: 0, y: (H - W) / 2, w: W, h: W}, k = Math.floor(t * 7) % IRF.length;
  satDraw(R, k, null, 0, {center: false, nopv: true});
  var g = cx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(11,14,19,.96)'); g.addColorStop(0.55, 'rgba(11,14,19,.78)'); g.addColorStop(1, 'rgba(11,14,19,.15)'); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  var a = ease(t / 1.2);
  cx.globalAlpha = a; cx.textBaseline = 'alphabetic';
  cx.font = '900 92px ' + FD; cx.fillStyle = C.ink; cx.fillText('Huracán Simon y Puerto Vallarta', 110, 330);
  cx.font = '500 58px ' + FD; cx.fillStyle = C.warm; cx.fillText('Lo que importa es dónde estás', 110, 420);
  cx.font = '700 54px ' + FD; cx.fillStyle = C.ink2; cx.fillText('Hurricane Simon and Puerto Vallarta', 110, 560);
  cx.font = '500 42px ' + FD; cx.fillStyle = '#d9b46a'; cx.fillText('What matters is where you are', 110, 628);
  cx.font = '500 26px ' + FM; cx.fillStyle = C.mute;
  cx.fillText('Datos al ' + ASOF_ES + ' (hora del centro) · Data as of ' + ASOF_EN + ' CST', 110, 760);
  cx.fillText('No es un pronóstico oficial: sigue a Protección Civil · Not an official forecast: follow Protección Civil', 110, 806);
  cx.globalAlpha = 1;
}});

scene({id: 'now', dur: 22, title: ['Dónde está Simon', 'Where Simon is now'], steps: [
  {at: 0, es: 'Imágenes reales del satélite GOES-18 de las últimas 4 horas. El ojo está a unos *' + fE(kmE) + ' km al ' + dirS + '* de Vallarta y avanza hacia el norte a unos *' + spdK + ' km/h*. Es un huracán fuerte (categoría ' + FX.cat + ').',
            en: 'Real GOES-18 satellite images from the last 4 hours. The eye is about *' + fN(miE) + ' miles ' + dirE + '* of Vallarta, moving north at about *' + spdM + ' mph*. It is a strong hurricane (Category ' + FX.cat + ').'},
  {at: 11, es: 'Si sigue así, el centro pasaría cerca de Vallarta el *domingo entre ' + hES(TIMES[FX.c1.i]).replace('~', '') + ' y ' + hES(TIMES[FX.c2.i]).replace('~', '') + '*' + (LANDFIRST ? ', ya sobre tierra y más débil' : '') + '. La trayectoria oficial del NHC (naranja) coincide. Aún puede moverse decenas de kilómetros.',
             en: 'If it keeps going like this, the center would pass near Vallarta *Sunday between ' + hEN(TIMES[FX.c1.i]).replace('~', '') + ' and ' + hEN(TIMES[FX.c2.i]).replace('~', '') + '*' + (LANDFIRST ? ', over land and weaker by then' : '') + '. The official NHC track (orange) agrees. It can still shift by tens of miles.'}],
  draw: function(t){
    var R = {x: VX + (VW - 1080) / 2, y: 0, w: 1080, h: 1080};
